# Render Blueprint for the API.
#
# The dashboard deploys to Vercel and the database is hosted on Neon, so this
# file describes only the Fastify service. Import it from the Render dashboard
# with New → Blueprint, then set the three secret values marked sync: false.
services:
  - type: web
    name: zerofayyz-fintech-api
    runtime: node
    rootDir: apps/api
    # Declared here, not only in the dashboard, because this service is
    # Blueprint-managed: "if any of those changes conflict with configuration
    # defined in the Blueprint, they're overwritten the next time you sync your
    # Blueprint." Left at `free`, this line would have silently reverted the
    # paid upgrade on some later sync and restored the 15-minute spin-down with
    # nobody having touched anything.
    #
    # Why it is paid at all, since $7/month deserves its reason in writing:
    # Render "spins down a Free web service that goes 15 minutes without
    # receiving any inbound traffic", and waking it measured 27-38 seconds. A
    # reviewer opens this link at an unpredictable moment, so the free tier made
    # their first impression a coin flip.
    plan: starter
    # Colocated with the Neon database and the Vercel function region. Split
    # them across continents and a single page load pays three intercontinental
    # round-trips: viewer to Vercel, Vercel to API, API to database.
    region: singapore
    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, and the TypeScript compiler and its type packages live
    # there. Without it the build fails on missing @types.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run before the server accepts traffic, so a deploy that
    # changes the schema cannot serve requests against the old one.
    startCommand: node dist/database/migrate.js && node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      # Pinned to match CI. Left unset, Render installs whatever Node is
      # newest, which means deploying on a different major version than the
      # pipeline tested against.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render routes to the container's published port; binding to loopback
      # only would make the service unreachable and fail the health check.
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        sync: false
      # The SPA clients a payer may be returned to after Stripe Checkout, as an
      # allowlist. The return origin is chosen by the caller's Origin header so
      # that a payment started on the Vue client comes back to the Vue client —
      # and a caller-chosen redirect target is an open redirect unless it is
      # matched against a list like this one. Not secret; safe in the repo.
      - key: CLIENT_ORIGINS
        value: https://zerofayyz-fintech-vue.vercel.app,https://zerofayyz-fintech-svelte.vercel.app
      # Keys the client-fingerprint HMAC in the sessions and audit tables.
      # Generated by Render rather than set by hand: without it the code falls
      # back to a development string that is public in this repository, which
      # would make the "keyed" hash keyed with a key everyone has.
      - key: SESSION_SECRET
        generateValue: true
