name: Production watch

# Monitoring with a person on the end of it. The smoke suite already knows how
# to interrogate the live deployment from outside; running it on a schedule
# turns it from a release gate into a monitor, and a failed scheduled run is
# GitHub's own notification to the repository owner — alerting with no new
# infrastructure to operate or pay for. An alert nobody receives is a log line;
# this one lands in email.
on:
  schedule:
    - cron: "17 * * * *" # scheduled hourly; GitHub actually fires it every few hours (see the keep-alive job)
  workflow_dispatch: {}

jobs:
  smoke:
    name: Smoke the live deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the production smoke suite
        env:
          # The signed-webhook probe is the only check that needs a credential, and
          # it covers the failure /health cannot see: a secret that is present but
          # stale, which reports "configured" while every real Stripe delivery is
          # refused. REQUIRE makes a missing secret fail the run rather than quietly
          # skip the probe — a monitor that stops monitoring must say so.
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SMOKE_REQUIRE_WEBHOOK_PROBE: "1"
        run: node scripts/production-smoke.mjs

  keep-supabase-awake:
    name: Keep the receipt portal's Supabase project awake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A Supabase free project pauses after about a week without activity, and a
      # paused project makes the receipt portal — linked from this README and from
      # job proposals — return nothing to a reviewer. This job makes the request that
      # resets the timer.
      #
      # What this job used to assume, and why it was wrong. Until 2026-09-11 it made
      # ONE request: an anonymous read of `public.payments`, which PostgreSQL refuses
      # (401, SQLSTATE 42501) because `anon` holds no grant there. The comment claimed
      # the refusal "still comes from the database, which is what keeps the project
      # awake". On 2026-09-11 Supabase warned the project would be paused for seven
      # days without activity — while every run of this job was green. A refused
      # request is not activity. The check was a negative control only: it proved
      # the deny was in place and proved nothing about the thing it was named for.
      #
      # So there are two requests now. First a positive control: call
      # `public.keepalive()` (receipt-portal migration 0002 — `select now()`,
      # SECURITY INVOKER, executable by `anon`, touches no customer table) and
      # require 200. That is the request that counts. Then the negative control,
      # unchanged: read `payments` and require the 401/42501 refusal, because a 200
      # there would mean someone granted anon access to a customer's payments.
      #
      # The cron above says hourly. GitHub runs scheduled jobs when it has capacity,
      # and in practice this one fires every three to five hours. That is still far
      # inside a seven-day window; do not describe it as hourly anywhere it matters.
      #
      # The key is the PUBLISHABLE key, already published in the portal's browser
      # bundle by design; row-level security, not this key's secrecy, is what keeps
      # one customer out of another's rows.
      - name: Make a request the database accepts (positive control)
        env:
          SUPABASE_URL: https://ezjisssfdcgozenfegqo.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_LDqApcSmhG27KrQr7qJKcw_G9lYBLYT
        run: |
          code=$(curl -s --max-time 30 -o /tmp/keepalive.txt -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" -d '{}' \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/rpc/keepalive")
          echo "status=$code body=$(cat /tmp/keepalive.txt)"
          if [ "$code" != "200" ]; then
            echo "keepalive() did not succeed — the project may be paused, the key rotated, or migration 0002 not applied." >&2
            exit 1
          fi
          echo "Awake: PostgreSQL executed keepalive() for anon."
      - name: Read a customer table as anon, and expect to be refused (negative control)
        env:
          SUPABASE_URL: https://ezjisssfdcgozenfegqo.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_LDqApcSmhG27KrQr7qJKcw_G9lYBLYT
        run: |
          code=$(curl -s --max-time 30 -o /tmp/body.txt -w "%{http_code}" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/payments?select=id&limit=1")
          body=$(cat /tmp/body.txt)
          echo "status=$code body=$body"
          if [ "$code" = "200" ]; then
            echo "REGRESSION: anon can read public.payments. RLS default-deny has been weakened." >&2
            exit 1
          fi
          if [ "$code" = "401" ] && echo "$body" | grep -q "42501"; then
            echo "Healthy: PostgreSQL refused the anonymous read of a customer table."
            exit 0
          fi
          echo "Unexpected answer from the payments read — key rotated or grants changed." >&2
          exit 1
