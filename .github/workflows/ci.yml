name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_DB: zerofayyz_fintech
  POSTGRES_USER: zerofayyz_fintech
  POSTGRES_PASSWORD: zerofayyz_fintech

jobs:
  api:
    name: API — typecheck, unit, integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: zerofayyz_fintech
          POSTGRES_USER: zerofayyz_fintech
          POSTGRES_PASSWORD: zerofayyz_fintech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerofayyz_fintech -d zerofayyz_fintech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Typecheck
        working-directory: apps/api
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/api
        run: npm run test:unit

      - name: Apply migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://zerofayyz_fintech:zerofayyz_fintech@127.0.0.1:5432/zerofayyz_fintech
        run: npm run migrate

      - name: Integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://zerofayyz_fintech:zerofayyz_fintech@127.0.0.1:5432/zerofayyz_fintech
        run: npm run test:integration

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/web
        run: npm run build

  web-vue:
    name: Vue client — typecheck, unit, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-vue/package-lock.json

      # The shared contract carries its own dependencies and no client installs
      # it implicitly (the postinstall that once did was removed with the Vercel
      # prebuilt-deploy work). This step is required, not redundant.
      - name: Install shared contract
        working-directory: packages/api-contract
        run: npm ci

      - name: Install dependencies
        working-directory: apps/web-vue
        run: npm ci

      - name: Typecheck
        working-directory: apps/web-vue
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/web-vue
        run: npm test

      - name: Build
        working-directory: apps/web-vue
        run: npm run build

  web-svelte:
    name: Svelte client — typecheck, unit, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-svelte/package-lock.json

      # The shared contract carries its own dependencies and no client installs
      # it implicitly (the postinstall that once did was removed with the Vercel
      # prebuilt-deploy work). This step is required, not redundant.
      - name: Install shared contract
        working-directory: packages/api-contract
        run: npm ci

      - name: Install dependencies
        working-directory: apps/web-svelte
        run: npm ci

      - name: Typecheck
        working-directory: apps/web-svelte
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/web-svelte
        run: npm test

      - name: Build
        working-directory: apps/web-svelte
        run: npm run build

  e2e:
    name: End-to-end — reviewer path
    runs-on: ubuntu-latest
    needs: [api, web]

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: zerofayyz_fintech
          POSTGRES_USER: zerofayyz_fintech
          POSTGRES_PASSWORD: zerofayyz_fintech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerofayyz_fintech -d zerofayyz_fintech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://zerofayyz_fintech:zerofayyz_fintech@127.0.0.1:5432/zerofayyz_fintech
      API_URL: http://127.0.0.1:4000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Apply migrations
        working-directory: apps/api
        run: npm run migrate

      - name: Load demo data
        run: psql "$DATABASE_URL" -f database/postgres/seeds/001_demo_data.sql

      - name: Seed staff accounts
        working-directory: apps/api
        env:
          # A CI-only value for a CI-only database that is destroyed with the
          # job. The real admin password is set by a person, never by a
          # pipeline.
          ADMIN_PASSWORD: ci-throwaway-admin-password
        run: npm run seed:staff

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
