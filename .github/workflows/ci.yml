name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_DB: zerofayyz_fintech
  POSTGRES_USER: zerofayyz_fintech
  POSTGRES_PASSWORD: zerofayyz_fintech

jobs:
  api:
    name: API — typecheck, unit, integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: zerofayyz_fintech
          POSTGRES_USER: zerofayyz_fintech
          POSTGRES_PASSWORD: zerofayyz_fintech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerofayyz_fintech -d zerofayyz_fintech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Typecheck
        working-directory: apps/api
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/api
        run: npm run test:unit

      - name: Apply migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://zerofayyz_fintech:zerofayyz_fintech@127.0.0.1:5432/zerofayyz_fintech
        run: npm run migrate

      - name: Integration tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://zerofayyz_fintech:zerofayyz_fintech@127.0.0.1:5432/zerofayyz_fintech
        run: npm run test:integration

  container:
    name: API — container builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: zerofayyz_fintech
          POSTGRES_PASSWORD: zerofayyz_fintech
          POSTGRES_DB: zerofayyz_fintech
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t zerofayyz-api apps/api
      # A Dockerfile that has never been started is decoration. This starts it
      # and waits for the container's OWN healthcheck to report healthy, which
      # exercises /api/v1/ready from inside the image.
      - name: Run it and wait for the container healthcheck
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL="postgresql://zerofayyz_fintech:zerofayyz_fintech@127.0.0.1:5432/zerofayyz_fintech" \
            -e SESSION_SECRET="ci-throwaway-session-secret-0123456789" \
            zerofayyz-api
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api)
            echo "attempt $i: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && { docker logs api; exit 1; }
            sleep 5
          done
          docker logs api
          exit 1
      - name: It must run unprivileged, without the build toolchain
        run: |
          test "$(docker exec api whoami)" = "node"
          test "$(docker exec api sh -c 'ls node_modules | grep -c "^typescript$"')" = "0"

  reconciler:
    name: Reconciler (Go) — vet, test, and check the ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: zerofayyz_fintech
          POSTGRES_USER: zerofayyz_fintech
          POSTGRES_PASSWORD: zerofayyz_fintech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerofayyz_fintech -d zerofayyz_fintech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://zerofayyz_fintech:zerofayyz_fintech@127.0.0.1:5432/zerofayyz_fintech

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: services/reconciler/go.sum

      - name: Vet
        working-directory: services/reconciler
        run: go vet ./...

      - name: Unit tests
        working-directory: services/reconciler
        run: go test ./... -v

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare a database to reconcile
        working-directory: apps/api
        run: npm ci && npm run migrate && npm run seed:demo

      # The real assertion: run it against a seeded ledger and require a clean
      # report. Exit code 1 means the payments table and the event log
      # disagree, which on seeded data would mean the seed itself is wrong.
      - name: Reconcile the seeded ledger
        working-directory: services/reconciler
        run: go run ./cmd/reconcile

  web:
    name: Web — lint, typecheck, unit, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      # The e2e typecheck (tsconfig.e2e.json) follows contract-parity.spec.ts
      # into the shared package, so its dependencies must exist here too — the
      # same install the Vue and Svelte jobs already carry.
      - name: Install shared contract dependencies
        working-directory: packages/api-contract
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      # Covers the reachability classification the dashboard renders from: a
      # server that never answered must not be reported as a server that failed.
      - name: Unit tests
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        run: npm run build

  web-vue:
    name: Vue client — typecheck, unit, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-vue/package-lock.json

      # The shared contract carries its own dependencies and no client installs
      # it implicitly (the postinstall that once did was removed with the Vercel
      # prebuilt-deploy work). This step is required, not redundant.
      - name: Install shared contract
        working-directory: packages/api-contract
        run: npm ci

      - name: Install dependencies
        working-directory: apps/web-vue
        run: npm ci

      - name: Typecheck
        working-directory: apps/web-vue
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/web-vue
        run: npm test

      - name: Build
        working-directory: apps/web-vue
        run: npm run build

  web-svelte:
    name: Svelte client — typecheck, unit, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-svelte/package-lock.json

      # The shared contract carries its own dependencies and no client installs
      # it implicitly (the postinstall that once did was removed with the Vercel
      # prebuilt-deploy work). This step is required, not redundant.
      - name: Install shared contract
        working-directory: packages/api-contract
        run: npm ci

      - name: Install dependencies
        working-directory: apps/web-svelte
        run: npm ci

      - name: Typecheck
        working-directory: apps/web-svelte
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/web-svelte
        run: npm test

      - name: Build
        working-directory: apps/web-svelte
        run: npm run build

  visual:
    name: Visual regression — layout has not shifted
    # Runs INSIDE the same image the baselines were recorded in. Screenshot
    # comparison is only meaningful against a matching renderer; on a plain
    # runner the font rasterisation differs and every snapshot fails for
    # reasons that have nothing to do with the layout.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    needs: [api, web]

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: zerofayyz_fintech
          POSTGRES_USER: zerofayyz_fintech
          POSTGRES_PASSWORD: zerofayyz_fintech
        options: >-
          --health-cmd "pg_isready -U zerofayyz_fintech -d zerofayyz_fintech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Inside a job container, services are reachable by name rather than on
      # localhost.
      DATABASE_URL: postgresql://zerofayyz_fintech:zerofayyz_fintech@postgres:5432/zerofayyz_fintech
      SESSION_SECRET: ci-throwaway-session-secret-0123456789
      PLAYWRIGHT_VISUAL: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install shared contract dependencies
        working-directory: packages/api-contract
        run: npm ci

      - name: Apply migrations
        working-directory: apps/api
        run: npm run migrate

      - name: Load demo data
        working-directory: apps/api
        run: npm run seed:demo

      - name: Seed staff accounts
        working-directory: apps/api
        env:
          ADMIN_PASSWORD: ci-throwaway-admin-password
        run: npm run seed:staff

      - name: Compare against the committed baselines
        working-directory: apps/web
        run: npm run test:visual

      # The diff images are the whole point of a failure here: a reviewer needs
      # to see what moved, not read that something did.
      - name: Upload the visual diff
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: apps/web/test-results
          retention-days: 7

  e2e:
    name: End-to-end — reviewer path
    runs-on: ubuntu-latest
    needs: [api, web]

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: zerofayyz_fintech
          POSTGRES_USER: zerofayyz_fintech
          POSTGRES_PASSWORD: zerofayyz_fintech
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerofayyz_fintech -d zerofayyz_fintech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://zerofayyz_fintech:zerofayyz_fintech@127.0.0.1:5432/zerofayyz_fintech
      API_URL: http://127.0.0.1:4000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      # The contract-parity spec imports packages/api-contract at runtime, so
      # this job needs the package's dependencies just like the web job does.
      # Hidden until now because pushes cancel in-flight runs: several e2e
      # jobs since the spec landed were cancelled before reaching this step.
      - name: Install shared contract dependencies
        working-directory: packages/api-contract
        run: npm ci

      - name: Apply migrations
        working-directory: apps/api
        run: npm run migrate

      - name: Load demo data
        run: psql "$DATABASE_URL" -f database/postgres/seeds/001_demo_data.sql

      - name: Seed staff accounts
        working-directory: apps/api
        env:
          # A CI-only value for a CI-only database that is destroyed with the
          # job. The real admin password is set by a person, never by a
          # pipeline.
          ADMIN_PASSWORD: ci-throwaway-admin-password
        run: npm run seed:staff

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
